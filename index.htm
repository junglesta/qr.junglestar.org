<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>QR Generator | JUNGLESTAR</title>
        <meta name="version" content="2.0.1" />
        <script src="qrcode.min.js"></script>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background: oklch(0.8353 0.3231 148.24);
                padding: 20px;
            }

            .container {
                background: white;
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                max-width: 500px;
                width: 100%;
            }

            h1 {
                text-align: center;
                margin-bottom: 30px;
                color: #000;
                font-size: 28px;
            }

            .input-group {
                margin-bottom: 20px;
            }

            input[type="text"] {
                width: 100%;
                padding: 15px;
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                font-size: 16px;
                transition: border-color 0.3s;
            }

            input[type="text"]:focus {
                outline: none;
                border-color: oklch(0.8353 0.3231 148.24);
            }

            button {
                width: 100%;
                padding: 15px;
                background: oklch(0.8353 0.3231 148.24);
                color: #000;
                border: none;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    transform 0.2s,
                    opacity 0.2s;
                margin-bottom: 10px;
            }

            button:hover {
                transform: translateY(-2px);
                opacity: 0.9;
            }

            button:active {
                transform: translateY(0);
            }

            #qrcode {
                display: none;
            }

            #preview {
                margin: 30px 0;
                text-align: center;
                min-height: 256px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #preview svg {
                max-width: 100%;
                height: auto;
            }

            .buttons {
                display: none;
                gap: 10px;
            }

            .buttons.show {
                display: flex;
            }

            .download-btn {
                flex: 1;
            }

            .placeholder {
                color: #999;
                font-size: 14px;
            }

            .footer {
                text-align: center;
                margin-top: 20px;
                padding-top: 20px;
                border-top: 1px solid #e0e0e0;
            }

            .footer a {
                color: #000;
                font-size: 12px;
                text-decoration: none;
                cursor: pointer;
                transition: opacity 0.2s;
            }

            .footer a:hover {
                opacity: 0.6;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>QR Code Generator</h1>

            <div class="input-group">
                <input
                    type="text"
                    id="textInput"
                    placeholder="Enter text or URL"
                    value="https://qr.junglestar.org"
                />
            </div>

            <button onclick="generateQR()">Generate QR Code</button>

            <div id="preview">
                <div class="placeholder">
                    Enter text above to generate QR code
                </div>
            </div>

            <div id="qrcode"></div>

            <div class="buttons" id="downloadButtons">
                <button class="download-btn" onclick="downloadSVG()">
                    Download SVG
                </button>
                <button class="download-btn" onclick="downloadPNG()">
                    Download PNG
                </button>
            </div>

            <div class="footer">
                <a id="shareLink" onclick="copyToClipboard()">Share this</a>
            </div>
        </div>

        <script>
            let currentQR = null;

            function generateQR() {
                const text = document.getElementById("textInput").value.trim();
                if (!text) {
                    alert("Please enter some text or URL");
                    return;
                }

                // Clear previous QR code
                document.getElementById("qrcode").innerHTML = "";

                // Generate QR code on canvas
                currentQR = new QRCode(document.getElementById("qrcode"), {
                    text: text,
                    width: 256,
                    height: 256,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H,
                });

                // Wait for QR code to render, then convert to SVG
                setTimeout(() => {
                    const canvas = document.querySelector("#qrcode canvas");
                    if (canvas) {
                        const svg = canvasToSVG(canvas);
                        document.getElementById("preview").innerHTML = "";
                        document.getElementById("preview").appendChild(svg);
                        document
                            .getElementById("downloadButtons")
                            .classList.add("show");
                    }
                }, 100);
            }

            function canvasToSVG(canvas) {
                const ctx = canvas.getContext("2d");
                const width = canvas.width;
                const height = canvas.height;
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;

                // Create SVG
                const svg = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg",
                );
                svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
                svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                svg.style.width = "256px";
                svg.style.height = "256px";

                // Add white background
                const bg = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect",
                );
                bg.setAttribute("width", width);
                bg.setAttribute("height", height);
                bg.setAttribute("fill", "white");
                svg.appendChild(bg);

                // Combine consecutive horizontal pixels into bars
                for (let y = 0; y < height; y++) {
                    let x = 0;
                    while (x < width) {
                        const index = (y * width + x) * 4;
                        const r = data[index];

                        // If pixel is dark, find the run length
                        if (r < 128) {
                            let runLength = 1;
                            while (x + runLength < width) {
                                const nextIndex =
                                    (y * width + x + runLength) * 4;
                                if (data[nextIndex] < 128) {
                                    runLength++;
                                } else {
                                    break;
                                }
                            }

                            // Create a single rectangle for the entire run
                            const rect = document.createElementNS(
                                "http://www.w3.org/2000/svg",
                                "rect",
                            );
                            rect.setAttribute("x", x);
                            rect.setAttribute("y", y);
                            rect.setAttribute("width", runLength);
                            rect.setAttribute("height", "1");
                            rect.setAttribute("fill", "black");
                            svg.appendChild(rect);

                            x += runLength;
                        } else {
                            x++;
                        }
                    }
                }

                return svg;
            }

            function downloadSVG() {
                const svg = document.querySelector("#preview svg");
                if (!svg) return;

                const svgData = new XMLSerializer().serializeToString(svg);
                const blob = new Blob([svgData], { type: "image/svg+xml" });
                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                a.download = "qrcode.svg";
                a.click();

                URL.revokeObjectURL(url);
            }

            function downloadPNG() {
                const canvas = document.querySelector("#qrcode canvas");
                if (!canvas) return;

                // Create a larger canvas for high-res PNG
                const largeCanvas = document.createElement("canvas");
                largeCanvas.width = 1000;
                largeCanvas.height = 1000;
                const ctx = largeCanvas.getContext("2d");

                // Disable image smoothing for crisp scaling
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(canvas, 0, 0, 1000, 1000);

                largeCanvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "qrcode.png";
                    a.click();
                    URL.revokeObjectURL(url);
                });
            }

            function copyToClipboard() {
                const url = "https://qr.junglestar.org";
                const link = document.getElementById("shareLink");

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard
                        .writeText(url)
                        .then(() => {
                            link.textContent = "Copied!";
                            setTimeout(() => {
                                link.textContent = "Share this";
                            }, 2000);
                        })
                        .catch((err) => {
                            console.error("Clipboard error:", err);
                            link.textContent = "Copied!";
                            setTimeout(() => {
                                link.textContent = "Share this";
                            }, 2000);
                        });
                } else {
                    // Fallback for older browsers
                    const textArea = document.createElement("textarea");
                    textArea.value = url;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand("copy");
                        link.textContent = "Copied!";
                        setTimeout(() => {
                            link.textContent = "Share this";
                        }, 2000);
                    } catch (err) {
                        console.error("Copy failed:", err);
                        link.textContent = "Failed";
                        setTimeout(() => {
                            link.textContent = "Share this";
                        }, 2000);
                    }
                    document.body.removeChild(textArea);
                }
            }

            // Allow Enter key to generate
            document
                .getElementById("textInput")
                .addEventListener("keypress", (e) => {
                    if (e.key === "Enter") {
                        generateQR();
                    }
                });
        </script>
    </body>
</html>
